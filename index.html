<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#0b1120">

<title>XWatch H5 Pro BLE Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #0b1120;
    color: #f9fafb;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h1 {
    font-size: 26px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9ca3af;
    margin-top: 0;
    margin-bottom: 22px;
}

.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 17px;
    margin: 4px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #374151;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 15px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ef4444;
}

.dot.connected {
    background: #22c55e;
}

.info {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
    margin-top: 15px;
}

.label {
    color: #9ca3af;
}

code {
    color: #93c5fd;
    word-break: break-all;
}

.service {
    border: 1px solid #374151;
    border-radius: 14px;
    overflow: hidden;
    margin-top: 12px;
}

.service-header {
    background: #1f2937;
    padding: 14px;
}

.characteristic {
    padding: 14px;
    border-top: 1px solid #374151;
}

.char-title {
    font-weight: 600;
    margin-bottom: 8px;
}

.properties {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 10px;
}

.value {
    background: #030712;
    padding: 10px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
}

.logs {
    background: #030712;
    border-radius: 12px;
    padding: 12px;
    height: 260px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.6;
}

.log-success {
    color: #86efac;
}

.log-error {
    color: #fca5a5;
}

.log-info {
    color: #93c5fd;
}

input {
    width: 100%;
    padding: 13px;
    background: #030712;
    border: 1px solid #374151;
    color: white;
    border-radius: 10px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.small {
    color: #9ca3af;
    font-size: 12px;
    line-height: 1.5;
}

@media(max-width:600px) {

    body {
        padding: 14px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>⌚ XWatch H5 Pro</h1>

<p class="subtitle">
BLE Diagnostic & GATT Explorer
</p>


<!-- CONNECTION -->

<div class="card">

<h2>Bluetooth</h2>

<div class="status">

<div id="statusDot" class="dot"></div>

<span id="statusText">
Disconnected
</span>

</div>

<button
id="scanBtn"
class="primary">

🔍 Scan XWatch

</button>

<button
id="disconnectBtn"
class="danger"
disabled>

Disconnect

</button>


<div class="info">

<div class="label">
Device
</div>

<div id="deviceName">
-
</div>


<div class="label">
Device ID
</div>

<div id="deviceId">
-
</div>

</div>

</div>


<!-- SERVICES -->

<div class="card">

<h2>GATT Services</h2>

<div id="services">
Belum terhubung.
</div>

</div>


<!-- CUSTOM SERVICE -->

<div class="card">

<h2>Custom Service</h2>

<p class="small">

Kalau nanti kita menemukan UUID proprietary
milik XWatch, masukkan UUID service di bawah.

</p>

<input
id="serviceUuid"
placeholder="Contoh: 0000xxxx-0000-1000-8000-00805f9b34fb">

<br><br>

<button
id="loadServiceBtn"
class="secondary"
disabled>

🔎 Load Service

</button>

</div>


<!-- LOG -->

<div class="card">

<h2>Bluetooth Log</h2>

<div id="logs" class="logs"></div>

<br>

<button
id="clearLogBtn"
class="secondary">

Clear Log

</button>

</div>

</div>


<script>

"use strict";


/* =========================================
   GLOBAL
========================================= */

let device = null;
let server = null;


/* =========================================
   DOM
========================================= */

const scanBtn =
document.getElementById("scanBtn");

const disconnectBtn =
document.getElementById("disconnectBtn");

const loadServiceBtn =
document.getElementById("loadServiceBtn");

const serviceUuidInput =
document.getElementById("serviceUuid");

const statusText =
document.getElementById("statusText");

const statusDot =
document.getElementById("statusDot");

const deviceName =
document.getElementById("deviceName");

const deviceId =
document.getElementById("deviceId");

const servicesContainer =
document.getElementById("services");

const logs =
document.getElementById("logs");

const clearLogBtn =
document.getElementById("clearLogBtn");


/* =========================================
   LOG
========================================= */

function log(message, type = "info") {

    const time =
    new Date().toLocaleTimeString();

    const div =
    document.createElement("div");

    div.className =
    "log-" + type;

    div.textContent =
    `[${time}] ${message}`;

    logs.appendChild(div);

    logs.scrollTop =
    logs.scrollHeight;

    console.log(message);
}


/* =========================================
   STATUS
========================================= */

function setConnected(value) {

    if (value) {

        statusText.textContent =
        "Connected";

        statusDot.classList.add(
        "connected"
        );

        disconnectBtn.disabled =
        false;

        loadServiceBtn.disabled =
        false;

    } else {

        statusText.textContent =
        "Disconnected";

        statusDot.classList.remove(
        "connected"
        );

        disconnectBtn.disabled =
        true;

        loadServiceBtn.disabled =
        true;
    }
}


/* =========================================
   BLUETOOTH CHECK
========================================= */

if (!navigator.bluetooth) {

    log(
    "Web Bluetooth tidak didukung browser ini.",
    "error"
    );

    scanBtn.disabled = true;

} else {

    log(
    "Web Bluetooth tersedia."
    );
}


/* =========================================
   SCAN
========================================= */

scanBtn.addEventListener(
"click",
async () => {

    if (!navigator.bluetooth) {

        log(
        "Web Bluetooth tidak tersedia.",
        "error"
        );

        return;
    }


    try {

        log(
        "Membuka Bluetooth device picker..."
        );


        /*
         * SERVICE UUID YANG BENAR
         *
         * 180D = Heart Rate
         * 1809 = Health Thermometer
         * 1822 = Pulse Oximeter
         * 180F = Battery
         * 180A = Device Information
         */

        device =
        await navigator.bluetooth.requestDevice({

            acceptAllDevices: true,

            optionalServices: [

                "180D",
                "1809",
                "1822",
                "180F",
                "180A"

            ]

        });


        log(
        "Device dipilih: " +
        (device.name || "Unknown"),
        "success"
        );


        deviceName.textContent =
        device.name || "Unknown";


        deviceId.textContent =
        device.id || "-";


        device.addEventListener(
        "gattserverdisconnected",
        handleDisconnected
        );


        await connectDevice();


    } catch(error) {

        log(
        "Scan gagal: " +
        error.message,
        "error"
        );

        console.error(error);

    }

});


/* =========================================
   CONNECT
========================================= */

async function connectDevice() {

    try {

        log(
        "Menghubungkan ke GATT..."
        );


        server =
        await device.gatt.connect();


        setConnected(true);


        log(
        "BERHASIL CONNECT KE XWATCH! 🎉",
        "success"
        );


        await discoverServices();


    } catch(error) {

        setConnected(false);

        log(
        "Connect gagal: " +
        error.message,
        "error"
        );
    }
}


/* =========================================
   DISCOVER SERVICES
========================================= */

async function discoverServices() {

    servicesContainer.innerHTML = "";

    log(
    "Mencari GATT services..."
    );


    try {

        const services =
        await server.getPrimaryServices();


        log(
        `Ditemukan ${services.length} GATT service.`,
        "success"
        );


        if (
        services.length === 0
        ) {

            servicesContainer.textContent =
            "Tidak ada service.";

            return;
        }


        for (
        const service of services
        ) {

            await displayService(
            service
            );
        }


    } catch(error) {

        log(
        "Gagal membaca GATT services: " +
        error.message,
        "error"
        );
    }
}


/* =========================================
   DISPLAY SERVICE
========================================= */

async function displayService(service) {

    const box =
    document.createElement("div");

    box.className =
    "service";


    const header =
    document.createElement("div");

    header.className =
    "service-header";


    header.innerHTML = `

        <strong>SERVICE</strong><br>

        <code>
        ${service.uuid}
        </code>

    `;


    box.appendChild(header);


    const charContainer =
    document.createElement("div");


    box.appendChild(
    charContainer
    );


    servicesContainer.appendChild(
    box
    );


    try {

        const characteristics =
        await service.getCharacteristics();


        log(
        `${service.uuid} → ${characteristics.length} characteristic`
        );


        for (
        const characteristic
        of characteristics
        ) {

            displayCharacteristic(
            characteristic,
            charContainer
            );
        }


    } catch(error) {

        log(
        "Characteristic gagal dibaca: " +
        error.message,
        "error"
        );
    }
}


/* =========================================
   CHARACTERISTIC
========================================= */

function displayCharacteristic(
characteristic,
container
) {

    const box =
    document.createElement("div");

    box.className =
    "characteristic";


    const title =
    document.createElement("div");

    title.className =
    "char-title";


    title.innerHTML = `

        Characteristic<br>

        <code>
        ${characteristic.uuid}
        </code>

    `;


    const properties =
    document.createElement("div");

    properties.className =
    "properties";


    properties.textContent =
    "Properties: " +
    characteristic.properties.join(", ");


    const value =
    document.createElement("div");

    value.className =
    "value";

    value.textContent =
    "Belum ada data";


    const buttons =
    document.createElement("div");


    /* READ */

    if (
    characteristic.properties.includes(
    "read"
    )
    ) {

        const button =
        document.createElement("button");

        button.className =
        "secondary";

        button.textContent =
        "📥 READ";


        button.onclick =
        async () => {

            await readCharacteristic(
            characteristic,
            value
            );

        };


        buttons.appendChild(
        button
        );
    }


    /* NOTIFY */

    if (
    characteristic.properties.includes(
    "notify"
    )
    ) {

        const button =
        document.createElement("button");

        button.className =
        "primary";

        button.textContent =
        "🔔 NOTIFY";


        button.onclick =
        async () => {

            await startNotification(
            characteristic,
            value,
            button
            );

        };


        buttons.appendChild(
        button
        );
    }


    box.appendChild(title);

    box.appendChild(properties);

    box.appendChild(value);

    box.appendChild(buttons);


    container.appendChild(box);
}


/* =========================================
   READ
========================================= */

async function readCharacteristic(
characteristic,
output
) {

    try {

        const data =
        await characteristic.readValue();


        const bytes =
        new Uint8Array(
        data.buffer
        );


        const hex =
        bytesToHex(bytes);


        const ascii =
        bytesToAscii(bytes);


        output.textContent =

        "HEX:\n" +
        hex +
        "\n\nASCII:\n" +
        ascii;


        log(
        `READ ${characteristic.uuid}: ${hex}`,
        "success"
        );


    } catch(error) {

        log(
        "READ ERROR: " +
        error.message,
        "error"
        );
    }
}


/* =========================================
   NOTIFICATION
========================================= */

async function startNotification(
characteristic,
output,
button
) {

    try {

        await characteristic.startNotifications();


        characteristic.addEventListener(
        "characteristicvaluechanged",
        event => {

            const bytes =
            new Uint8Array(
            event.target.value.buffer
            );


            const hex =
            bytesToHex(bytes);


            const ascii =
            bytesToAscii(bytes);


            output.textContent =

            "HEX:\n" +
            hex +
            "\n\nASCII:\n" +
            ascii;


            log(
            `NOTIFY ${characteristic.uuid}: ${hex}`,
            "success"
            );

        });


        button.textContent =
        "🔔 Listening...";

        button.disabled =
        true;


        log(
        "Notification aktif: " +
        characteristic.uuid,
        "success"
        );


    } catch(error) {

        log(
        "NOTIFY ERROR: " +
        error.message,
        "error"
        );
    }
}


/* =========================================
   CUSTOM SERVICE
========================================= */

loadServiceBtn.addEventListener(
"click",
async () => {

    const uuid =
    serviceUuidInput.value.trim();


    if (!uuid) {

        log(
        "UUID belum dimasukkan.",
        "error"
        );

        return;
    }


    try {

        log(
        "Mencoba custom service: " +
        uuid
        );


        const service =
        await server.getPrimaryService(
        uuid
        );


        log(
        "Custom service ditemukan! 🎉",
        "success"
        );


        await displayService(
        service
        );


    } catch(error) {

        log(
        "Custom service gagal: " +
        error.message,
        "error"
        );
    }

});


/* =========================================
   DISCONNECT
========================================= */

disconnectBtn.addEventListener(
"click",
() => {

    if (
    device &&
    device.gatt &&
    device.gatt.connected
    ) {

        device.gatt.disconnect();

        log(
        "Disconnected."
        );
    }

});


/* =========================================
   DISCONNECTED
========================================= */

function handleDisconnected() {

    setConnected(false);

    log(
    "XWatch terputus.",
    "error"
    );
}


/* =========================================
   BYTE → HEX
========================================= */

function bytesToHex(bytes) {

    return Array.from(bytes)
    .map(
    byte =>
    byte
    .toString(16)
    .padStart(2, "0")
    .toUpperCase()
    )
    .join(" ");
}


/* =========================================
   BYTE → ASCII
========================================= */

function bytesToAscii(bytes) {

    return Array.from(bytes)
    .map(byte => {

        if (
        byte >= 32 &&
        byte <= 126
        ) {

            return String.fromCharCode(
            byte
            );

        }

        return ".";

    })
    .join("");
}


/* =========================================
   CLEAR LOG
========================================= */

clearLogBtn.addEventListener(
"click",
() => {

    logs.innerHTML = "";

});


/* =========================================
   START
========================================= */

log(
"XWatch H5 Pro BLE Tool siap."
);

log(
"Model target: XW5P"
);

log(
"Firmware target: XW5P-1.0.5.4"
);

</script>

</body>
</html>
