<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0b1120">

<title>XWatch H5 Pro BLE Explorer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));

    background: #0b1120;
    color: #f9fafb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h1 {
    margin: 0;
    font-size: 27px;
}

.subtitle {
    color: #9ca3af;
    margin-top: 7px;
    margin-bottom: 20px;
}

.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 17px;
    margin: 4px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #374151;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ef4444;
}

.dot.connected {
    background: #22c55e;
}

.info {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 9px;
    margin-top: 15px;
}

.label {
    color: #9ca3af;
}

.value-text {
    word-break: break-all;
}

.service {
    border: 1px solid #374151;
    border-radius: 14px;
    overflow: hidden;
    margin-top: 12px;
}

.service-header {
    padding: 14px;
    background: #1f2937;
}

.characteristic {
    padding: 14px;
    border-top: 1px solid #374151;
}

.char-title {
    font-weight: 600;
    margin-bottom: 8px;
}

.properties {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 10px;
}

.data {
    background: #030712;
    border-radius: 10px;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 20px;
}

input {
    width: 100%;
    padding: 13px;

    border-radius: 11px;
    border: 1px solid #374151;

    background: #030712;
    color: white;

    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.logs {
    background: #030712;
    border-radius: 12px;
    padding: 12px;

    height: 270px;
    overflow-y: auto;

    font-family: monospace;
    font-size: 12px;
    line-height: 1.6;
}

.log-info {
    color: #93c5fd;
}

.log-success {
    color: #86efac;
}

.log-error {
    color: #fca5a5;
}

.log-warning {
    color: #fde68a;
}

.small {
    color: #9ca3af;
    font-size: 12px;
    line-height: 1.5;
}

.badge {
    display: inline-block;
    background: #1f2937;
    color: #93c5fd;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    margin-top: 5px;
}

.empty {
    color: #9ca3af;
    padding: 10px 0;
}

@media (max-width: 600px) {

    body {
        padding: 14px;
    }

    h1 {
        font-size: 23px;
    }

    .info {
        grid-template-columns: 1fr;
        gap: 2px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>⌚ XWatch H5 Pro</h1>

    <div class="subtitle">
        BLE / GATT Explorer
    </div>


    <!-- CONNECTION -->

    <div class="card">

        <h2>Bluetooth</h2>

        <div class="status">

            <div id="statusDot" class="dot"></div>

            <span id="statusText">
                Disconnected
            </span>

        </div>


        <button
            id="scanButton"
            class="primary">

            🔍 Scan XWatch

        </button>


        <button
            id="disconnectButton"
            class="danger"
            disabled>

            Disconnect

        </button>


        <div class="info">

            <div class="label">
                Device
            </div>

            <div
                id="deviceName"
                class="value-text">

                -

            </div>


            <div class="label">
                Device ID
            </div>

            <div
                id="deviceId"
                class="value-text">

                -

            </div>


            <div class="label">
                Status
            </div>

            <div
                id="connectionState">

                Disconnected

            </div>

        </div>

    </div>


    <!-- GATT -->

    <div class="card">

        <h2>GATT Services</h2>

        <div
            id="servicesContainer"
            class="empty">

            Belum terhubung.

        </div>

    </div>


    <!-- CUSTOM SERVICE -->

    <div class="card">

        <h2>Custom Service</h2>

        <p class="small">

            Jika nanti kita menemukan UUID khusus milik
            XWatch, masukkan UUID lengkap di sini.

        </p>


        <input
            id="customService"
            type="text"
            autocomplete="off"
            placeholder="0000xxxx-0000-1000-8000-00805f9b34fb">


        <br>


        <button
            id="loadCustomButton"
            class="secondary"
            disabled>

            🔎 Load Service

        </button>

    </div>


    <!-- LOG -->

    <div class="card">

        <h2>Bluetooth Log</h2>

        <div
            id="logContainer"
            class="logs">
        </div>


        <br>


        <button
            id="clearLogButton"
            class="secondary">

            Clear Log

        </button>

    </div>

</div>


<script>

"use strict";


/* ==================================================
   XWATCH H5 PRO BLE EXPLORER
================================================== */


/* --------------------------------------------------
   GLOBAL
-------------------------------------------------- */

let bluetoothDevice = null;
let gattServer = null;


/* --------------------------------------------------
   STANDARD BLE UUID
-------------------------------------------------- */

const STANDARD_SERVICES = [

    /*
     * Battery Service
     */
    "0000180f-0000-1000-8000-00805f9b34fb",

    /*
     * Device Information Service
     */
    "0000180a-0000-1000-8000-00805f9b34fb",

    /*
     * Heart Rate Service
     */
    "0000180d-0000-1000-8000-00805f9b34fb",

    /*
     * Health Thermometer
     */
    "00001809-0000-1000-8000-00805f9b34fb",

    /*
     * Pulse Oximeter
     */
    "00001822-0000-1000-8000-00805f9b34fb"

];


/* --------------------------------------------------
   DOM
-------------------------------------------------- */

const scanButton =
    document.getElementById("scanButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const loadCustomButton =
    document.getElementById("loadCustomButton");

const clearLogButton =
    document.getElementById("clearLogButton");

const customService =
    document.getElementById("customService");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const connectionState =
    document.getElementById("connectionState");

const deviceName =
    document.getElementById("deviceName");

const deviceId =
    document.getElementById("deviceId");

const servicesContainer =
    document.getElementById("servicesContainer");

const logContainer =
    document.getElementById("logContainer");


/* --------------------------------------------------
   LOG
-------------------------------------------------- */

function addLog(
    message,
    type = "info"
) {

    const row =
        document.createElement("div");

    const time =
        new Date().toLocaleTimeString();

    row.className =
        "log-" + type;

    row.textContent =
        "[" + time + "] " + message;

    logContainer.appendChild(row);

    logContainer.scrollTop =
        logContainer.scrollHeight;

    console.log(message);
}


/* --------------------------------------------------
   STATUS
-------------------------------------------------- */

function setStatus(connected) {

    if (connected) {

        statusDot.classList.add(
            "connected"
        );

        statusText.textContent =
            "Connected";

        connectionState.textContent =
            "Connected";

        disconnectButton.disabled =
            false;

        loadCustomButton.disabled =
            false;

    } else {

        statusDot.classList.remove(
            "connected"
        );

        statusText.textContent =
            "Disconnected";

        connectionState.textContent =
            "Disconnected";

        disconnectButton.disabled =
            true;

        loadCustomButton.disabled =
            true;
    }
}


/* --------------------------------------------------
   BROWSER CHECK
-------------------------------------------------- */

function checkBrowser() {

    if (!navigator.bluetooth) {

        addLog(
            "Browser ini tidak mendukung Web Bluetooth.",
            "error"
        );

        scanButton.disabled = true;

        return false;
    }

    addLog(
        "Web Bluetooth tersedia.",
        "success"
    );

    return true;
}


/* --------------------------------------------------
   SCAN
-------------------------------------------------- */

scanButton.addEventListener(
    "click",
    async function () {

        if (!checkBrowser()) {
            return;
        }


        try {

            addLog(
                "Membuka Bluetooth device picker..."
            );


            /*
             * Full UUID digunakan agar tidak ada
             * masalah alias service.
             */

            bluetoothDevice =
                await navigator.bluetooth.requestDevice({

                    acceptAllDevices: true,

                    optionalServices:
                        STANDARD_SERVICES

                });


            if (!bluetoothDevice) {

                addLog(
                    "Tidak ada device dipilih.",
                    "warning"
                );

                return;
            }


            deviceName.textContent =
                bluetoothDevice.name ||
                "Unknown";


            deviceId.textContent =
                bluetoothDevice.id ||
                "Unknown";


            addLog(
                "Device ditemukan: " +
                (
                    bluetoothDevice.name ||
                    "Unknown"
                ),
                "success"
            );


            bluetoothDevice.addEventListener(
                "gattserverdisconnected",
                handleDisconnected
            );


            await connect();


        } catch (error) {

            addLog(
                "Scan gagal: " +
                error.message,
                "error"
            );

        }

    }
);


/* --------------------------------------------------
   CONNECT
-------------------------------------------------- */

async function connect() {

    if (!bluetoothDevice) {

        addLog(
            "Belum ada device.",
            "error"
        );

        return;
    }


    try {

        addLog(
            "Menghubungkan ke XWatch..."
        );


        gattServer =
            await bluetoothDevice.gatt.connect();


        if (!gattServer.connected) {

            throw new Error(
                "GATT connection gagal."
            );
        }


        setStatus(true);


        addLog(
            "BERHASIL CONNECT KE XWATCH H5 PRO! 🎉",
            "success"
        );


        await discoverServices();


    } catch (error) {

        setStatus(false);

        addLog(
            "Connect gagal: " +
            error.message,
            "error"
        );

    }
}


/* --------------------------------------------------
   DISCOVER SERVICES
-------------------------------------------------- */

async function discoverServices() {

    servicesContainer.innerHTML = "";


    if (!gattServer) {

        servicesContainer.textContent =
            "GATT server belum tersedia.";

        return;
    }


    addLog(
        "Mencari GATT Services..."
    );


    try {

        const services =
            await gattServer.getPrimaryServices();


        if (
            !services ||
            services.length === 0
        ) {

            servicesContainer.innerHTML =
                "Tidak ada service yang dapat diakses.";

            addLog(
                "Tidak ada GATT service yang dapat diakses.",
                "warning"
            );

            return;
        }


        addLog(
            "Ditemukan " +
            services.length +
            " GATT Service.",
            "success"
        );


        for (
            const service of services
        ) {

            await showService(service);

        }


    } catch (error) {

        addLog(
            "Gagal membaca GATT Services: " +
            error.message,
            "error"
        );


        servicesContainer.innerHTML = `

            <div class="empty">

                Browser tidak memberikan akses
                ke service yang tersedia.

                <br><br>

                Kemungkinan XWatch menggunakan
                service proprietary.

            </div>

        `;

    }
}


/* --------------------------------------------------
   SHOW SERVICE
-------------------------------------------------- */

async function showService(service) {

    const serviceBox =
        document.createElement("div");

    serviceBox.className =
        "service";


    const header =
        document.createElement("div");

    header.className =
        "service-header";


    header.innerHTML = `

        <strong>GATT SERVICE</strong>

        <br>

        <code>
            ${service.uuid}
        </code>

    `;


    serviceBox.appendChild(header);


    const characteristicsBox =
        document.createElement("div");


    serviceBox.appendChild(
        characteristicsBox
    );


    servicesContainer.appendChild(
        serviceBox
    );


    try {

        const characteristics =
            await service.getCharacteristics();


        addLog(
            service.uuid +
            " → " +
            characteristics.length +
            " characteristic"
        );


        for (
            const characteristic
            of characteristics
        ) {

            showCharacteristic(
                characteristic,
                characteristicsBox
            );

        }


    } catch (error) {

        addLog(
            "Tidak bisa membaca characteristic " +
            service.uuid +
            ": " +
            error.message,
            "warning"
        );

    }
}


/* --------------------------------------------------
   SHOW CHARACTERISTIC
-------------------------------------------------- */

function showCharacteristic(
    characteristic,
    container
) {

    const box =
        document.createElement("div");

    box.className =
        "characteristic";


    const title =
        document.createElement("div");

    title.className =
        "char-title";


    title.innerHTML = `

        Characteristic

        <br>

        <code>
            ${characteristic.uuid}
        </code>

    `;


    const properties =
        document.createElement("div");

    properties.className =
        "properties";


    properties.textContent =
        "Properties: " +
        characteristic.properties.join(
            ", "
        );


    const data =
        document.createElement("div");

    data.className =
        "data";

    data.textContent =
        "Belum ada data.";


    const buttons =
        document.createElement("div");


    /* ------------------------------------------------
       READ
    ------------------------------------------------ */

    if (
        characteristic.properties
            .includes("read")
    ) {

        const readButton =
            document.createElement("button");

        readButton.className =
            "secondary";

        readButton.textContent =
            "📥 READ";


        readButton.onclick =
            async function () {

                await readCharacteristic(
                    characteristic,
                    data
                );

            };


        buttons.appendChild(
            readButton
        );
    }


    /* ------------------------------------------------
       NOTIFY
    ------------------------------------------------ */

    if (
        characteristic.properties
            .includes("notify")
    ) {

        const notifyButton =
            document.createElement("button");

        notifyButton.className =
            "primary";

        notifyButton.textContent =
            "🔔 NOTIFY";


        notifyButton.onclick =
            async function () {

                await notifyCharacteristic(
                    characteristic,
                    data,
                    notifyButton
                );

            };


        buttons.appendChild(
            notifyButton
        );
    }


    box.appendChild(title);

    box.appendChild(properties);

    box.appendChild(data);

    box.appendChild(buttons);


    container.appendChild(box);
}


/* --------------------------------------------------
   READ CHARACTERISTIC
-------------------------------------------------- */

async function readCharacteristic(
    characteristic,
    output
) {

    try {

        addLog(
            "READ → " +
            characteristic.uuid
        );


        const value =
            await characteristic.readValue();


        const bytes =
            new Uint8Array(
                value.buffer
            );


        const hex =
            toHex(bytes);


        const ascii =
            toAscii(bytes);


        output.textContent =

            "HEX:\n" +
            hex +
            "\n\n" +

            "DECIMAL:\n" +
            Array.from(bytes).join(" ") +

            "\n\n" +

            "ASCII:\n" +
            ascii;


        addLog(
            "DATA ← " +
            hex,
            "success"
        );


    } catch (error) {

        addLog(
            "READ gagal: " +
            error.message,
            "error"
        );

    }
}


/* --------------------------------------------------
   NOTIFICATION
-------------------------------------------------- */

async function notifyCharacteristic(
    characteristic,
    output,
    button
) {

    try {

        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            function (event) {

                const bytes =
                    new Uint8Array(
                        event.target.value.buffer
                    );


                const hex =
                    toHex(bytes);


                const ascii =
                    toAscii(bytes);


                output.textContent =

                    "HEX:\n" +
                    hex +
                    "\n\n" +

                    "DECIMAL:\n" +
                    Array.from(bytes).join(" ") +

                    "\n\n" +

                    "ASCII:\n" +
                    ascii;


                addLog(
                    "NOTIFY ← " +
                    characteristic.uuid +
                    " : " +
                    hex,
                    "success"
                );

            }
        );


        button.textContent =
            "🔔 LISTENING";

        button.disabled =
            true;


        addLog(
            "Notification aktif.",
            "success"
        );


    } catch (error) {

        addLog(
            "Notification gagal: " +
            error.message,
            "error"
        );

    }
}


/* --------------------------------------------------
   CUSTOM SERVICE
-------------------------------------------------- */

loadCustomButton.addEventListener(
    "click",
    async function () {

        if (!gattServer) {

            addLog(
                "Belum terhubung ke XWatch.",
                "error"
            );

            return;
        }


        const uuid =
            customService.value
                .trim()
                .toLowerCase();


        if (!uuid) {

            addLog(
                "UUID belum dimasukkan.",
                "error"
            );

            return;
        }


        /*
         * Validasi UUID.
         */

        const uuidPattern =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;


        if (!uuidPattern.test(uuid)) {

            addLog(
                "Format UUID tidak valid.",
                "error"
            );

            return;
        }


        try {

            addLog(
                "Mencoba custom service: " +
                uuid
            );


            const service =
                await gattServer.getPrimaryService(
                    uuid
                );


            addLog(
                "CUSTOM SERVICE DITEMUKAN! 🎉",
                "success"
            );


            await showService(service);


        } catch (error) {

            addLog(
                "Custom service tidak dapat diakses: " +
                error.message,
                "error"
            );

        }

    }
);


/* --------------------------------------------------
   DISCONNECT
-------------------------------------------------- */

disconnectButton.addEventListener(
    "click",
    function () {

        try {

            if (
                bluetoothDevice &&
                bluetoothDevice.gatt &&
                bluetoothDevice.gatt.connected
            ) {

                bluetoothDevice.gatt.disconnect();

            }

        } catch (error) {

            addLog(
                "Disconnect error: " +
                error.message,
                "error"
            );

        }

    }
);


/* --------------------------------------------------
   DISCONNECTED EVENT
-------------------------------------------------- */

function handleDisconnected() {

    setStatus(false);

    addLog(
        "XWatch terputus.",
        "warning"
    );
}


/* --------------------------------------------------
   HEX
-------------------------------------------------- */

function toHex(bytes) {

    return Array.from(bytes)
        .map(function (byte) {

            return byte
                .toString(16)
                .padStart(2, "0")
                .toUpperCase();

        })
        .join(" ");
}


/* --------------------------------------------------
   ASCII
-------------------------------------------------- */

function toAscii(bytes) {

    return Array.from(bytes)
        .map(function (byte) {

            if (
                byte >= 32 &&
                byte <= 126
            ) {

                return String.fromCharCode(
                    byte
                );

            }

            return ".";

        })
        .join("");
}


/* --------------------------------------------------
   CLEAR LOG
-------------------------------------------------- */

clearLogButton.addEventListener(
    "click",
    function () {

        logContainer.innerHTML = "";

    }
);


/* --------------------------------------------------
   START
-------------------------------------------------- */

if (checkBrowser()) {

    addLog(
        "XWatch H5 Pro BLE Explorer siap."
    );

    addLog(
        "Target: XWatch H5 Pro / XW5P"
    );

    addLog(
        "Firmware: XW5P-1.0.5.4"
    );

}

</script>

</body>
</html>
